name: Deploy Chefcita
on:
  push:
    branches: [main, hardening/frontend]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run verify
      - name: Install browser smoke-test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke test rendered app
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/chefcita-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/chefcita/ >/dev/null && break; sleep 1; done
          node scripts/smoke-render.mjs
      - name: Verify compiled Pages artifact
        run: |
          test -f dist/index.html
          grep -q '/chefcita/assets/' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
