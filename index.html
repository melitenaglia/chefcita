<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FAFAF8" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      const pref=localStorage.getItem('chefcita:appearance')||'system';
      const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.appearance=dark?'dark':'light';
      document.documentElement.style.colorScheme=dark?'dark':'light';
      document.querySelector('meta[name="theme-color"]').content=dark?'#151816':'#FAFAF8';
    } catch (_) {}
  </script>
  <style>html,body{background:#FAFAF8;color:#292E2A}html[data-appearance="dark"],html[data-appearance="dark"] body{background:#151816;color:#E7EBE7}</style>
  <meta name="description" content="Chefcita — tu recetario compartido" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chefcita" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/chefcita-180.png" />
  <title>Chefcita</title>
</head>
<body>
  <div id="root"><div style="min-height:100vh;display:grid;place-items:center;font:600 16px system-ui;color:inherit">Cargando Chefcita…</div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
